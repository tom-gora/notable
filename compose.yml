############
# SERVICES #
############
services:
  ###############
  # NOTABLE APP #
  ###############
  notable-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: notable-app
    restart: "unless-stopped"
    # SECURITY: Prevent container from modifying its own binary/source code
    read_only: true
    user: "notableuser"
    # SECURITY: Resource limits prevent the miner from freezing your SSH session
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
          pids: 200
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    networks:
      - intranet
    ports:
      - "127.0.0.1:9001:9000"
    tmpfs:
      - /tmp
      - /var/run
      - /run
    volumes:
      - "./storage:/var/www/html/storage:rw"
      - "./bootstrap/cache:/var/www/html/bootstrap/cache:rw"
      - "./public/build:/var/www/html/public/build:rw"
    working_dir: /var/www/html
    depends_on:
      notable-db:
        condition: service_healthy
  ##############
  # POSTGRESQL #
  ##############
  notable-db:
    image: "docker.io/library/postgres:alpine"
    platform: linux/amd64
    restart: "unless-stopped"
    # TODO: locally exposed to setup a tunneled ssh connection later down the line
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: "${DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - "./docker_services/db_service/pg_data:/var/lib/postgresql/data"
    container_name: notable-db
    networks:
      - intranet
    healthcheck:
      interval: 10s
      test:
        - CMD-SHELL
        - "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
      timeout: 5s
      retries: 5
##################
# DOCKER NETWORK #
##################
networks:
  intranet:
    name: intranet
    driver: bridge
